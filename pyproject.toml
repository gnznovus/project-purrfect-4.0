[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "project-purrfect"
version = "0.5.0"
description = "Independent Purr Core and multi-tenant API Gateway"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2"]
[project.optional-dependencies]
redis = ["redis>=5,<9"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "redis>=5,<9", "psutil>=6,<9"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
"purrfect.operations" = ["static/*.html", "static/*.css", "static/*.js"]
