# Additive Site B lab. Use alongside compose.yaml in the same Compose project.
# Never run down -v: Site A and Sophira volumes must be preserved.
services:
  db_b:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-development-only
      MARIADB_ROOT_PASSWORD: local-root-only
    volumes:
      - wp_b_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wp_b:
    build: .
    ports:
      - "8085:80"
    environment:
      WORDPRESS_DB_HOST: db_b
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-development-only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('DISABLE_WP_CRON', true);
    volumes:
      - wp_b_data:/var/www/html
      - ../purr-child:/var/www/html/wp-content/plugins/purr-child:ro
      - ./mock-layout:/var/www/html/wp-content/plugins/mock-layout:ro
      - ./mock-translation:/var/www/html/wp-content/plugins/mock-translation:ro
    depends_on:
      db_b:
        condition: service_healthy
      purra:
        condition: service_started

  clock_b:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sleep $(($(date +%s) % 60 == 0 ? 60 : 60 - $(date +%s) % 60)); php /opt/purr-child-heartbeat.php || true; done"]
    environment:
      WORDPRESS_DB_HOST: db_b
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-development-only
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_b_data:/var/www/html
      - ../purr-child:/var/www/html/wp-content/plugins/purr-child:ro
      - ./mock-layout:/var/www/html/wp-content/plugins/mock-layout:ro
      - ./mock-translation:/var/www/html/wp-content/plugins/mock-translation:ro
      - ./heartbeat.php:/opt/purr-child-heartbeat.php:ro
    depends_on:
      - wp_b

  cli_b:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db_b
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-development-only
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_b_data:/var/www/html
      - ../purr-child:/var/www/html/wp-content/plugins/purr-child:ro
      - ./mock-layout:/var/www/html/wp-content/plugins/mock-layout:ro
      - ./mock-translation:/var/www/html/wp-content/plugins/mock-translation:ro
    depends_on:
      db_b:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  wp_b_db:
  wp_b_data:
