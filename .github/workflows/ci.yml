name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: PHP syntax
        run: |
          php -l wordpress/purr-child/purr-child.php
          php -l wordpress/purr-child/src/discovery.php
          php -l wordpress/examples/product-integration.php
          php -l tests/php/test_discovery.php
          php -l wordpress/purr-child/src/heartbeat.php
          php -l wordpress/purr-child/src/runner.php
          php -l wordpress/lab/heartbeat.php
          php -l wordpress/lab/mock-layout/mock-layout.php
          php -l wordpress/lab/mock-translation/mock-translation.php
          php -l tests/php/test_heartbeat.php
          php -l tests/php/test_knowledge_leasing.php
          php -l wordpress/purr-child/src/chat.php
          php -l wordpress/purr-child/src/admin.php
          php -l tests/php/test_admin.php
          php -l tests/php/test_network_health.php
      - name: PHP discovery smoke
        run: |
          php tests/php/test_discovery.php
          php tests/php/test_heartbeat.php
          php tests/php/test_knowledge_leasing.php
          php tests/php/test_admin.php
          php tests/php/test_network_health.php
      - name: Local chat JavaScript syntax
        run: |
          node --check wordpress/purr-child/assets/chat.js
          node --check wordpress/purr-child/assets/widget.js
          node --check wordpress/purr-child/assets/admin.js
      - name: PowerShell bootstrap syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path bootstrap.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Docker Compose configuration
        run: |
          docker compose -f wordpress/lab/compose.yaml config --quiet
          docker compose -f wordpress/lab/compose.yaml -f wordpress/lab/compose.site-b.yaml config --quiet
